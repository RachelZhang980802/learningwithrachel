<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzes · 三版设计预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9dfc8;color:#382e24;font-family:Georgia,serif}header{position:sticky;top:0;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:15px 22px;background:#faf5e9;border-bottom:1px solid #c4b298;z-index:2}h1{font-size:20px;margin:0 auto 0 0}button,a{font:16px Georgia,serif;color:inherit}button{padding:9px 17px;border:1px solid #bda88d;background:transparent;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#9b4e37;color:#fff8e9;border-color:#9b4e37}a{padding:9px}main{padding:22px;text-align:center}img{display:block;max-width:100%;width:auto;max-height:calc(100vh - 135px);margin:auto;box-shadow:0 8px 25px #6b49332b;cursor:zoom-in}body.zoom img{max-height:none;width:100%;cursor:zoom-out}p{font:14px system-ui;margin:12px 0;color:#78674f}</style>
<header><h1>Quizzes · 设计预览</h1><button aria-pressed="true" data-option="1">方案 1</button><button aria-pressed="false" data-option="2">方案 2</button><button aria-pressed="false" data-option="3">方案 3</button><a id="original" href="option-1.png" target="_blank">打开原图 ↗</a></header>
<main><img id="preview" src="option-1.png" alt="Quizzes 方案 1"><p>点击图片放大或缩小 · 使用 ← → 键切换 · 示例题目仅用于展示布局</p></main>
<script>let current=1;function select(n){current=n;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.option)===n)));document.getElementById('preview').src='option-'+n+'.png';document.getElementById('preview').alt='Quizzes 方案 '+n;document.getElementById('original').href='option-'+n+'.png'}document.querySelectorAll('button').forEach(b=>b.onclick=()=>select(Number(b.dataset.option)));document.getElementById('preview').onclick=()=>document.body.classList.toggle('zoom');document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')select(current%3+1);if(e.key==='ArrowLeft')select((current+1)%3+1)})</script></html>
