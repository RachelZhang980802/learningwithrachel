<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mindmap · Learning with Rachel</title><link rel="stylesheet" href="style.css?v=river-10-1"><link rel="stylesheet" href="fonts.css"></head><body>
<header class="masthead"><div class="identity"><span class="eyebrow" id="eyebrow">READING ATLAS</span><h1>Mindmap<span class="title-dot">.</span></h1></div><div class="article-info"><p id="article-title"></p><span id="source-count"></span></div><button id="review-toggle" aria-expanded="false" aria-controls="review">文章核对 <span id="review-count"></span></button></header>
<nav class="source-nav" aria-label="选择导图材料" id="sources"></nav>
<div class="toolbar" role="toolbar" aria-label="导图工具"><button id="outline-toggle" aria-expanded="false" aria-controls="outline">☰ 分部</button><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="搜索当前导图" aria-label="查找导图文字" autocomplete="off"><span id="search-count"></span><button id="search-next" aria-label="下一个匹配项" hidden>↓</button></label><div class="view-controls"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-level">100%</output><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应画布</button><button id="reset">1:1</button><button id="fullscreen" aria-label="全屏导图">⛶</button></div></div>
<main class="workspace"><aside class="outline" id="outline"><div class="outline-heading"><span>CONTENTS</span><button id="expand-all">全部展开</button></div><div id="sections"></div><div class="outline-footer"><span id="node-count"></span></div></aside><section id="viewport" tabindex="0" aria-label="可缩放、拖动的思维导图画布"><div id="scene"></div><div class="minimap-wrap"><span>OVERVIEW</span><button id="minimap" aria-label="点击缩略图定位画布"></button></div><div id="empty" hidden></div><div class="canvas-help" id="canvas-help">拖动画布 · 双击放大 · ⌘ / Ctrl + 滚轮缩放</div><div class="canvas-label" id="canvas-label">INTERACTIVE MINDMAP</div></section><aside id="review" class="review" hidden><div class="review-heading"><div><span class="eyebrow">CLOSE READING</span><h2>与文章一起读</h2></div><button id="review-close" aria-label="关闭核对栏">×</button></div><div id="selection" hidden></div><div id="checks"></div></aside></main>
<footer class="statusbar"><span id="status" role="status" aria-live="polite">正在读取导图…</span><span>Learning with Rachel</span></footer><script src="app.js?v=river-10-1" type="module"></script></body></html>
