<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f1ede2">
<title>Quiz time · Western Culture</title>
<meta name="description" content="Four chapter quizzes for Western Culture.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23171718'/%3E%3Cpath d='M8 21q6-8 12 0t12 0M8 28q6-8 12 0t12 0' fill='none' stroke='%23f4ecd7' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="quiz.css?v=sea-alignment-20261005">
<link rel="stylesheet" href="shared-footer.css">
<script src="quiz.js?v=continuous-sea-20261005" defer></script>
</head>
<body class="quiz-page">
<a href="#quiz-content" class="skip-link">Skip to quiz content</a>
<main id="quiz-content" class="quiz-app" data-scene="one">
  <header class="quiz-topbar">
    <nav class="quiz-nav" aria-label="Quiz chapters" role="tablist">
      <a class="quiz-back" href="greece.html#discussion"><span aria-hidden="true">←</span><span>Back</span></a>
      <button type="button" role="tab" aria-selected="true" data-quiz-chapter="one">Chapter One</button>
      <button type="button" role="tab" aria-selected="false" tabindex="-1" data-quiz-chapter="two">Chapter Two</button>
      <button type="button" role="tab" aria-selected="false" tabindex="-1" data-quiz-chapter="three">Chapter Three</button>
      <button type="button" role="tab" aria-selected="false" tabindex="-1" data-quiz-chapter="four">Chapter Four</button>
    </nav>
  </header>

  <section class="quiz-title-block" aria-labelledby="quiz-title">
    <h1 id="quiz-title">QUIZ TIME</h1>
  </section>

  <section class="quiz-progress-panel" aria-label="Quiz progress">
    <div class="quiz-progress-heading">
      <span class="quiz-progress-chapter" data-quiz-chapter-label>Chapter One</span>
      <span class="quiz-progress-count" data-quiz-progress-label>01 / 100</span>
    </div>
    <div class="quiz-progress-track">
      <input type="range" min="1" max="100" value="1" step="1" data-quiz-progress aria-label="Jump to question">
    </div>
  </section>

  <section class="quiz-question-viewport" aria-label="Current quiz question" tabindex="0">
    <div class="quiz-list" data-quiz-root aria-live="polite"><p class="quiz-loading">Loading the chapter quiz...</p></div>
  </section>

  <section class="quiz-art-zone" aria-label="Chapter illustration">
    <img class="quiz-art" data-quiz-art src="https://assets.negentropylearning.com.cn/western-culture/assets/quiz/chapter-one-art-transparent.png" alt="Chapter One hand-drawn illustration">
    <!-- Adjacent viewports of ONE complete illustration share the same vertical
         scale. The boat keeps its proportions; only open water absorbs width. -->
    <div class="quiz-sea-scene" role="img" aria-label="Greek sailboat with continuous hand-drawn waves">
      <svg class="quiz-sea-boat" viewBox="0 15 970 688" preserveAspectRatio="none" aria-hidden="true">
        <image href="https://assets.negentropylearning.com.cn/western-culture/assets/quiz/chapter-two-continuous-sea.png" width="2172" height="724" />
      </svg>
      <svg class="quiz-sea-water" viewBox="970 15 1202 688" preserveAspectRatio="none" aria-hidden="true">
        <image href="https://assets.negentropylearning.com.cn/western-culture/assets/quiz/chapter-two-continuous-sea.png" width="2172" height="724" />
      </svg>
    </div>
  </section>

  <footer class="quiz-footer">
    <div class="quiz-footer-name">CHINA WEST NORMAL<br>UNIVERSITY</div>
    <img class="quiz-footer-seal" src="/western-culture/allusions-assets/university-seal.png" alt="China West Normal University seal">
    <small>© 2026 China West Normal University</small>
  </footer>
</main>
  <script src="/western-culture/shared-footer.js" defer></script>
</body>
</html>
