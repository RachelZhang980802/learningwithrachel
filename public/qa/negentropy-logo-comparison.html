<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NegentropyLearning logo comparison</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e9e6dc;color:#191a17;font-family:Arial,Helvetica,sans-serif}.board{height:100vh;padding:18px;display:grid;grid-template-rows:278px 1fr;gap:16px}.panel{position:relative;overflow:hidden;border:1px solid rgba(73,65,53,.18);border-radius:20px;background:#f8f6ef;box-shadow:0 14px 34px rgba(56,48,37,.11)}.label{position:absolute;z-index:2;top:12px;left:14px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.86);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.source{display:grid;place-items:center;padding:42px 28px 18px}.source img{width:235px;height:235px;object-fit:contain;display:block}.implementation{background:#f7f5ed}.implementation .label{left:auto;right:14px}.implementation iframe{position:absolute;top:0;left:0;width:1280px;height:720px;border:0;transform-origin:top left;transform:scale(.55)}
  </style>
</head>
<body>
  <main class="board">
    <section class="panel source">
      <span class="label">Selected concept</span>
      <img src="/qa/negentropy-learning-option-2-reference.png" alt="Selected NegentropyLearning logo concept" />
    </section>
    <section class="panel implementation">
      <span class="label">Implemented at 16:9</span>
      <iframe src="/#text" title="Current local implementation"></iframe>
    </section>
  </main>
</body>
</html>
